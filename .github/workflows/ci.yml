name: CI Build & Security Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-scan:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff bandit
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run Ruff Lint & Format Checks
      run: |
        # Run Ruff linter checks
        ruff check .
        # Run Ruff code formatter checks
        ruff format --check .

    - name: Run Bandit Security Scanner
      run: |
        # Run Bandit to scan for common Python vulnerabilities
        bandit -r . -x ./venv,./.venv,./tests
